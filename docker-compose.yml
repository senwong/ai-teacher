services:
  ai-teacher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-https://mirrors.ustc.edu.cn}"
    container_name: ai-teacher
    restart: unless-stopped
    ports:
      - "${AI_TEACHER_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      AI_TEACHER_DB: /app/data/ai_teacher.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
