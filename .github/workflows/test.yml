name: test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/main.py app/db/sqlite.py app/student/service.py app/session/service.py app/worksheet/service.py
      - run: PYTHONPATH=. pytest -q
