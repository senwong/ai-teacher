<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师登录</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><div class="brand-mark">AI</div><span class="eyebrow">AI Teacher</span><h1>欢迎回来</h1><p class="muted">登录教师工作台，继续管理班级和学生学习。</p></div>{% if error %}<p class="warning">{{ error }}</p>{% endif %}<form action="/login" method="post" class="form-stack"><label>邮箱<input type="email" name="email" required autocomplete="email" placeholder="teacher@example.com"></label><label>密码<input type="password" name="password" required autocomplete="current-password" placeholder="输入密码"></label><button class="large-button" type="submit">登录教师工作台</button></form><div class="auth-footer">还没有账号？<a href="/register">注册教师账号</a></div></section></main></body></html>
