<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师登录</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container auth-shell"><section class="card auth-card"><span class="eyebrow">AI Teacher</span><h1>教师登录</h1><p class="muted">登录后管理自己的班级和学生。</p>{% if error %}<p class="warning">{{ error }}</p>{% endif %}<form action="/login" method="post" class="form-stack"><label>邮箱<input type="email" name="email" required autocomplete="email"></label><label>密码<input type="password" name="password" required autocomplete="current-password"></label><button type="submit">登录</button></form><p class="muted">还没有账号？<a href="/register">注册教师账号</a></p></section></main></body></html>
