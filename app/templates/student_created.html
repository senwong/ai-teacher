<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生已创建</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><a href="/classes/{{ classroom.id }}">← {{ classroom.name }}</a><section class="card"><span class="eyebrow">Student Access</span><h1>{{ student.name }} 已创建</h1><p class="muted">请把下面的登录信息交给学生。PIN 只在这里显示一次。</p><div class="ios-list"><div class="group-row"><div class="group-row-main"><span class="group-row-title">班级码</span><span class="group-row-sub">{{ classroom.name }}</span></div><strong>{{ classroom.class_code }}</strong></div><div class="group-row"><div class="group-row-main"><span class="group-row-title">姓名</span></div><strong>{{ student.name }}</strong></div><div class="group-row"><div class="group-row-main"><span class="group-row-title">4 位 PIN</span><span class="group-row-sub">请学生妥善保存</span></div><strong style="font-size:24px;letter-spacing:4px">{{ pin }}</strong></div></div><div class="actions" style="margin-top:20px"><a class="button" href="/students/{{ student.id }}">进入学生档案</a><a class="button secondary" href="/student/login">打开学生登录页</a></div></section></main></body></html>
