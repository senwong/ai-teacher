<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册教师账号</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container auth-shell"><section class="card auth-card"><span class="eyebrow">AI Teacher</span><h1>注册教师账号</h1><p class="muted">创建账号后即可建立班级并添加学生。</p>{% if error %}<p class="warning">{{ error }}</p>{% endif %}<form action="/register" method="post" class="form-stack"><label>教师姓名<input name="name" required maxlength="40" autocomplete="name"></label><label>邮箱<input type="email" name="email" required autocomplete="email"></label><label>密码<input type="password" name="password" required minlength="8" autocomplete="new-password"><span class="muted">至少 8 位</span></label><button type="submit">注册并登录</button></form><p class="muted">已有账号？<a href="/login">直接登录</a></p></section></main></body></html>
