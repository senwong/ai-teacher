<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册教师账号</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><div class="brand-mark">AI</div><span class="eyebrow">AI Teacher</span><h1>创建教师账号</h1><p class="muted">建立班级、添加学生，并让 AI Teacher 持续跟踪每个人的学习进度。</p></div>{% if error %}<p class="warning">{{ error }}</p>{% endif %}<form action="/register" method="post" class="form-stack"><label>教师姓名<input name="name" required maxlength="40" autocomplete="name" placeholder="例如：张老师"></label><label>邮箱<input type="email" name="email" required autocomplete="email" placeholder="teacher@example.com"></label><label>密码<input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="至少 8 位"><span class="muted">密码会经过安全哈希后保存</span></label><button class="large-button" type="submit">注册并进入工作台</button></form><div class="auth-footer">已有账号？<a href="/login">直接登录</a></div></section></main></body></html>
