<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ student.name }} · AI Teacher</title><link rel="stylesheet" href="/static/style.css"></head><body class="learning-body"><main class="student-shell"><a href="/">‹ 返回</a><section class="teacher-hero"><span class="eyebrow">Student Access</span><h1>你好，{{ student.name }}</h1><p class="muted">{{ student.classroom_name }} · {{ student.grade }} 年级</p><p>输入登录卡上的 4 位 PIN，就可以进入自己的学习空间。</p></section>{% if error %}<p class="warning">{{ error }}</p>{% endif %}<section class="card"><form action="/student/join/{{ login_code }}" method="post" class="form-stack"><label>4 位 PIN<input name="pin" required maxlength="4" pattern="[0-9]{4}" inputmode="numeric" autocomplete="one-time-code" placeholder="••••" autofocus></label><button class="large-button full-button" type="submit">进入我的学习空间</button></form></section><p class="student-focus">链接不对或忘记 PIN？请让老师重新生成登录卡。</p></main></body></html>
