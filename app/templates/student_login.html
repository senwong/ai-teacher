<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生登录 · AI Teacher</title><link rel="stylesheet" href="/static/style.css"></head><body class="learning-body"><main class="student-shell"><a href="/">‹ 返回</a><section class="teacher-hero"><span class="eyebrow">Student Access</span><h1>欢迎回来</h1><p class="muted">输入老师给你的班级码、姓名和 4 位 PIN。</p></section>{% if error %}<p class="warning">{{ error }}</p>{% endif %}<section class="card"><form action="/student/login" method="post" class="form-stack"><label>班级码<input name="class_code" required maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="例如 A1B2C3"></label><label>姓名<input name="name" required maxlength="40" autocomplete="name" placeholder="例如 小明"></label><label>4 位 PIN<input name="pin" required maxlength="4" pattern="[0-9]{4}" inputmode="numeric" autocomplete="one-time-code" placeholder="••••"></label><button class="large-button full-button" type="submit">进入我的学习空间</button></form></section><p class="student-focus">忘记 PIN？请让老师在学生档案中重置。</p></main></body></html>
