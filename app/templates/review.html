<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>确认识别结果</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><section class="card"><span class="eyebrow">Step 3</span><h1>确认答案</h1>{% if vision_error %}<p class="warning">Vision 识别失败：{{ vision_error }}。可以直接手工填写。</p>{% elif vision_enabled %}<p class="muted">下面是从照片中识别出的最终答案。请确认后再批改，避免视觉识别误差污染学生模型。</p>{% else %}<p class="muted">填写纸上最终答案后提交。之后配置 Vision API 即可自动预填。</p>{% endif %}<form action="/worksheets/{{ worksheet.id }}/grade" method="post">{% for q in worksheet.questions %}<label class="question"><span>{{ loop.index }}. {{ q.prompt }}</span><input name="{{ q.id }}" value="{{ answers[q.id] }}" inputmode="numeric" autocomplete="off"></label>{% endfor %}<button type="submit">确认并让老师批改</button></form></section></main></body></html>
