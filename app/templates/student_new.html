<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>添加学生</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><a href="/students">← 学生列表</a><section class="card"><span class="eyebrow">Student Management</span><h1>添加学生</h1>{% if error %}<p class="warning">{{ error }}</p>{% endif %}<form action="/students" method="post" class="form-stack"><label>姓名<input name="name" required maxlength="40" placeholder="例如：小明"></label><label>年级<select name="grade">{% for g in range(1,7) %}<option value="{{ g }}" {{ 'selected' if g==3 else '' }}>{{ g }} 年级</option>{% endfor %}</select></label><button type="submit">创建学生</button></form></section></main></body></html>
