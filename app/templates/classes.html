<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的班级</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><div class="top-nav"><div class="brand"><div class="brand-mark">AI</div><div><div>AI Teacher</div><span class="muted">{{ user.name }}</span></div></div><form action="/logout" method="post"><button class="ghost" type="submit">退出</button></form></div><section class="page-header"><div><span class="eyebrow">Teacher Console</span><h1>我的班级</h1><p class="muted">快速查看班级并进入学生学习档案。</p></div><a class="button-link" href="/classes/new">创建班级</a></section>{% if classrooms %}<div class="ios-section-title">班级</div><section class="ios-list">{% for c in classrooms %}<a class="group-row" href="/classes/{{ c.id }}"><div class="student-name"><span class="avatar">{{ c.grade }}</span><div class="group-row-main"><span class="group-row-title">{{ c.name }}</span><span class="group-row-sub">{{ c.grade }} 年级 · {{ c.student_count }} 名学生</span></div></div><span class="chevron">›</span></a>{% endfor %}</section>{% else %}<section class="card empty-state"><div class="empty-icon">＋</div><h2>创建第一个班级</h2><p class="muted">创建班级后，就可以添加学生并开始个性化学习。</p><a class="button-link" href="/classes/new">创建班级</a></section>{% endif %}</main></body></html>
