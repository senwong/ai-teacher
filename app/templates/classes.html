<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的班级</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><div class="top-nav"><div><span class="eyebrow">Teacher</span><strong>{{ user.name }}</strong></div><form action="/logout" method="post"><button class="secondary" type="submit">退出登录</button></form></div><header><div><span class="eyebrow">Classroom Management</span><h1>我的班级</h1><p class="muted">从班级进入学生档案、诊断和学习 Session。</p></div><a class="button-link" href="/classes/new">+ 创建班级</a></header>{% if classrooms %}<section class="student-grid">{% for c in classrooms %}<article class="card student-card"><span class="eyebrow">{{ c.grade }} 年级</span><h2>{{ c.name }}</h2><p class="muted">{{ c.student_count }} 名学生</p><a class="button-link secondary" href="/classes/{{ c.id }}">进入班级</a></article>{% endfor %}</section>{% else %}<section class="card"><h2>还没有班级</h2><p class="muted">先创建一个班级，再添加学生。</p><a class="button-link" href="/classes/new">创建第一个班级</a></section>{% endif %}</main></body></html>
