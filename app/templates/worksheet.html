<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打印试卷</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><section class="card"><span class="eyebrow">Step 1</span><h1>试卷已生成</h1><p>Worksheet ID：<strong>{{ worksheet.id }}</strong></p><p><a class="button" href="/worksheets/{{ worksheet.id }}.pdf" target="_blank">打开 / 打印 PDF</a></p></section><section class="card"><span class="eyebrow">Step 2</span><h2>完成后拍照上传</h2><p class="muted">请尽量从正上方拍摄，保证整张 A4、题号、答案和二维码都在画面内。</p><form action="/worksheets/{{ worksheet.id }}/upload" method="post" enctype="multipart/form-data"><input type="file" name="photo" accept="image/jpeg,image/png,image/webp" capture="environment" required><button type="submit">上传答卷照片</button></form><div class="meta">{{ '系统会自动尝试 Vision 识别。' if vision_enabled else '当前未配置 OPENAI_API_KEY，上传后仍可手工录入最终答案。' }}</div></section><a href="/">← 返回老师</a></main></body></html>
