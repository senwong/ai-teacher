<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打印试卷</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><section class="card"><span class="eyebrow">{{ student.name }} · Session {{ session.id if session else '-' }}</span><h1>试卷已生成</h1><p>Worksheet ID：<strong>{{ worksheet.id }}</strong></p><p><a class="button" href="/worksheets/{{ worksheet.id }}.pdf" target="_blank">打开 / 打印 PDF</a></p></section><section class="card"><h2>完成后拍照上传</h2><p class="muted">整张 A4 和二维码都要在画面内。</p><form action="/worksheets/{{ worksheet.id }}/upload" method="post" enctype="multipart/form-data"><input type="file" name="photo" accept="image/jpeg,image/png,image/webp" capture="environment" required><button type="submit">上传答卷照片</button></form></section>{% if session %}<a href="/students/{{ student.id }}/sessions/{{ session.id }}">← 返回本次学习</a>{% endif %}</main></body></html>
