<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生管理</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><header><div><span class="eyebrow">AI Teacher</span><h1>学生管理</h1></div><a class="button-link" href="/students/new">+ 添加学生</a></header>{% if students %}<section class="student-grid">{% for s in students %}<article class="card student-card"><div><span class="eyebrow">{{ s.grade }} 年级</span><h2>{{ s.name }}</h2><p class="muted">数学掌握度 {{ '%.0f'|format(s.mastery*100) }}% · 已练习 {{ s.attempts }} 题</p><p class="meta">最近学习：{{ s.last_activity or '还没有学习记录' }}</p></div><div class="actions"><a class="button-link" href="/students/{{ s.id }}">查看详情</a><form action="/students/{{ s.id }}/sessions" method="post"><button type="submit">开始学习</button></form></div></article>{% endfor %}</section>{% else %}<section class="card"><h2>还没有学生</h2><p class="muted">先创建第一个学生，再开始独立记录学习进度。</p><a class="button-link" href="/students/new">添加学生</a></section>{% endif %}</main></body></html>
