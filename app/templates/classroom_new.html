<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创建班级</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><a href="/classes">← 我的班级</a><section class="card"><span class="eyebrow">Classroom</span><h1>创建班级</h1>{% if error %}<p class="warning">{{ error }}</p>{% endif %}<form action="/classes" method="post" class="form-stack"><label>班级名称<input name="name" required maxlength="60" placeholder="例如：三年级一班"></label><label>年级<select name="grade">{% for g in range(1,7) %}<option value="{{ g }}" {{ 'selected' if g==3 else '' }}>{{ g }} 年级</option>{% endfor %}</select></label><button type="submit">创建班级</button></form></section></main></body></html>
